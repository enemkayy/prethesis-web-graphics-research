<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-thesis Web Graphics Research Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; color: #fff; }
        header { background: #111; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        header h1 { font-size: 1.1rem; color: #4fc3f7; }
        nav button { background: #222; color: #ccc; border: 1px solid #444; padding: 8px 14px; margin-left: 6px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        nav button:hover, nav button.active { background: #0288d1; color: #fff; border-color: #0288d1; }
        #viewport-container { flex: 1; width: 100%; height: 100%; border: none; background: #000; }
    </style>
</head>
<body>
    <header>
        <h1>Web Graphics Research Portal</h1>
        <nav>
            <button class="active" onclick="loadModule('modules/module1-webgl/index.html', this)">Module 1: WebGL</button>
            <button onclick="loadModule('modules/module2-configurator/index.html', this)">Module 2: 3D Configurator</button>
            <button onclick="loadModule('modules/module3-webgame/index.html', this)">Module 3: Web Game</button>
            <button onclick="loadModule('modules/module4-webar/index.html', this)">Module 4: WebAR</button>
        </nav>
    </header>

    <iframe id="viewport-container" src="modules/module1-webgl/index.html"></iframe>

    <script>
        function loadModule(url, btnElement) {
            document.getElementById('viewport-container').src = url;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
